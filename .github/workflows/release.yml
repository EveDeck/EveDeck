name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
      portable_sha256: ${{ steps.vt.outputs.portable_sha256 }}
      portable_vt_url: ${{ steps.vt.outputs.portable_vt_url }}
      portable_vt_summary: ${{ steps.vt.outputs.portable_vt_summary }}
      portable_vt_clean: ${{ steps.vt.outputs.portable_vt_clean }}
      installer_sha256: ${{ steps.vt.outputs.installer_sha256 }}
      installer_vt_url: ${{ steps.vt.outputs.installer_vt_url }}
      installer_vt_summary: ${{ steps.vt.outputs.installer_vt_summary }}
      installer_vt_clean: ${{ steps.vt.outputs.installer_vt_clean }}
      app_sha256: ${{ steps.vt.outputs.app_sha256 }}
      app_vt_url: ${{ steps.vt.outputs.app_vt_url }}
      app_vt_summary: ${{ steps.vt.outputs.app_vt_summary }}
      app_vt_clean: ${{ steps.vt.outputs.app_vt_clean }}

    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.3.1
          VERSION="${TAG#v}"                 # e.g. 1.3.1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      - name: Extract changelog from tag message
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read the tag's annotation via the GitHub API instead of the local checkout. Tried
          # `git for-each-ref --format='%(contents:body)'` against the checked-out repo twice
          # (v1.4.5, v1.4.6) and both times it silently returned the underlying COMMIT's message
          # instead of the tag's: actions/checkout resolves a tag-triggered workflow by commit SHA
          # (github.sha is the commit the annotated tag points to, not the tag object's own SHA),
          # so the local refs/tags/<name> ref it creates points straight at the commit and the
          # annotation is gone regardless of fetch-depth. The API has no such ambiguity -- it reads
          # the tag object directly by its own SHA.
          TAG="${GITHUB_REF_NAME}"
          OBJ_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/$TAG" --jq .object.sha)"
          OBJ_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/$TAG" --jq .object.type)"
          if [ "$OBJ_TYPE" = "tag" ]; then
            MSG="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$OBJ_SHA" --jq .message)"
            BODY="$(printf '%s\n' "$MSG" | tail -n +2 | sed '/./,$!d')"
          else
            BODY=""
          fi
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            BODY="No changelog notes were written for this tag."
          fi
          {
            echo "notes<<NOTES_EOF"
            echo "$BODY"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.x'

      - name: Update csproj version
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $proj = "app/src/EveDeck/EveDeck.csproj"
          (Get-Content $proj) -replace '<Version>[^<]+</Version>', "<Version>$ver</Version>" |
            Set-Content $proj

      - name: Publish self-contained
        shell: pwsh
        run: |
          # DebugType=none: ship no PDBs in the public build. With PDBs present, .NET resolves file
          # and line for every logged exception using the paths recorded AT BUILD TIME -- on a
          # windows-latest runner that is D:\a\EveDeck\EveDeck\..., so users' logs filled with stack
          # frames pointing at a drive that exists only inside a GitHub runner (247k such lines in one
          # user's log folder). It leaks nothing (org/repo names are public) but it is confusing and
          # bulky. The trade: shipped stack traces lose file/line and keep method names. Local and
          # `dotnet publish` builds are unaffected and still produce PDBs for development.
          dotnet publish app/src/EveDeck/EveDeck.csproj `
            -c Release --self-contained -r win-x64 `
            -p:DebugType=none `
            -o publish-ci

      - name: Package portable app (plain zip)
        shell: pwsh
        # A plain zip of the published app -- byte-for-byte the same files the installer lays down.
        #
        # This replaced Velopack on 2026-09-15. Velopack gave the portable build in-place
        # self-updating, but it did so via two prebuilt Rust stubs (Update.exe and a root launcher)
        # that shipped inside the zip, and those stubs were the ONLY thing VirusTotal ever flagged
        # in this download: measured per-file, EveDeck.exe scores 0/71 and the stubs carry 2 and 4
        # detections, with Sangfor's Trojan.Win32.Save.a on Update.exe being what dropped the zip to
        # "1 malicious" every release. The installer, whose payload is the app files with no stub,
        # has always come back 0/68. Removing the stubs removes the detection at the source.
        #
        # The cost is deliberate and accepted: the portable track no longer self-updates. The app
        # still CHECKS for updates (Services/UpdateCheckService polls evedeck.space/api/version) and
        # now opens the download page instead of applying anything -- which also retires the last
        # in-app code path that fetched and executed a remote payload. The Store build still updates
        # itself, via the Store.
        #
        # Filename is unchanged on purpose: evedeck.space's /api/version downloadUrl, the site's
        # download buttons and every past link all point at EveDeck-win-Portable.zip.
        #
        # Flat layout (EveDeck.exe at the zip root, no wrapper folder) so extracting over an
        # existing install replaces it in place. Explorer's "Extract All" still drops it into a
        # folder named after the zip, so this does not spray files into Downloads.
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path publish-ci\* -DestinationPath dist\EveDeck-win-Portable.zip -CompressionLevel Optimal

      - name: Build installer (Inno Setup)
        shell: pwsh
        # windows-latest usually ships Inno Setup 6 already, but install via choco (always present
        # on GH-hosted runners) if it's ever missing rather than assuming the image's software list.
        # MySourceDir points the .iss at publish-ci (repo root) instead of its local-dev default of
        # app\publish. This installer is a plain alternative download -- it does NOT self-update
        # (the in-app installer-update path was removed as a security fix in v1.53.3 and is not being
        # restored); installer users update by re-downloading. Portable and Store self-update.
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc app/installer/EveDeck.iss `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            "/DMySourceDir=$PWD\publish-ci"

      - name: Build Microsoft Store package (MSIX)
        shell: pwsh
        # Deliberately UNSIGNED: Microsoft re-signs Store submissions with its own certificate at
        # ingestion. Signing here would need a code-signing certificate whose subject names its
        # holder, which is exactly what publishing through the Store avoids. The artifact is
        # therefore not directly installable -- it is only meaningful uploaded to Partner Center.
        #
        # Not attached to the GitHub Release for the same reason: a .msix nobody can install would
        # only generate confused issues. It is uploaded as a workflow artifact for manual
        # submission instead.
        #
        # NOT continue-on-error. It used to be, and that is precisely how a malformed AppxManifest
        # (an illegal "--" inside an XML comment) broke every Store package for weeks: the step
        # failed, the job still reported success, and the only trace was a "No files were found with
        # the provided path" annotation that the release notes taught us to ignore. Store users sat
        # on 1.2x.x as a result. A packaging break must now turn the release red.
        run: |
          & app/scripts/pack-msix.ps1 `
            -Version ${{ steps.ver.outputs.version }} `
            -PublishDir "$PWD\publish-ci" `
            -OutFile "$PWD\publish-msix\EveDeck-Store-v${{ steps.ver.outputs.version }}.msix"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: msix-store-package
          path: publish-msix/*.msix
          # error, not warn: "no files found" was the symptom that got normalised as background
          # noise while the Store package was silently missing from every release.
          if-no-files-found: error
          retention-days: 90

      - name: Scan release files with VirusTotal
        id: vt
        shell: pwsh
        # Scans both downloads users can actually click, plus the app binary inside them. The same
        # function runs once per target with a distinct output prefix; each prefix's outputs are
        # independent.
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          function Invoke-VtScan {
            param([string]$Path, [string]$Prefix)

            $hash = (Get-FileHash -Algorithm SHA256 -Path $Path).Hash.ToLower()
            "${Prefix}_sha256=$hash" >> $env:GITHUB_OUTPUT

            if (-not $env:VT_API_KEY) {
              Write-Warning "VIRUSTOTAL_API_KEY not set; skipping VirusTotal scan for $Path."
              "${Prefix}_vt_url=" >> $env:GITHUB_OUTPUT
              "${Prefix}_vt_summary=scan skipped (no API key configured)" >> $env:GITHUB_OUTPUT
              "${Prefix}_vt_clean=" >> $env:GITHUB_OUTPUT
              return
            }

            $headers = @{ "x-apikey" = $env:VT_API_KEY }
            # The hash-based report page 404s until VirusTotal has fully indexed the file, which
            # for a brand-new hash can outlast our poll window below (or never happen at all if
            # the upload silently failed) -- only safe to link to once we actually have a verdict.
            $fileUrl = "https://www.virustotal.com/gui/file/$hash"
            $stats = $null
            $analysisId = $null

            # A rebuild of an identical tree (rare, but possible) hashes the same -- skip a
            # redundant upload/scan if VirusTotal already has a report for this exact file.
            try {
              $existing = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/$hash" -Headers $headers -Method Get -ErrorAction Stop
              $stats = $existing.data.attributes.last_analysis_stats
            } catch { }

            if (-not $stats) {
              try {
                $upResp = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Headers $headers -Method Get
                # Invoke-RestMethod's -Form quotes the multipart boundary in the Content-Type
                # header (PowerShell/PowerShell#9241); VirusTotal's API rejects a quoted
                # boundary with "Malformed multipart body." every time, so every upload since
                # this scan was added has silently failed. Shell out to the curl.exe that
                # ships on the Windows runner instead -- it sends an unquoted boundary VT accepts.
                $submitJson = & curl.exe -s -S -X POST -H "x-apikey: $($env:VT_API_KEY)" -F "file=@$Path" "$($upResp.data)"
                if ($LASTEXITCODE -ne 0) {
                  throw "curl.exe exited with code $LASTEXITCODE"
                }
                $submit = $submitJson | ConvertFrom-Json
                $analysisId = $submit.data.id

                # Fresh files typically finish in 2-4 minutes; give it up to 10 before moving on
                # rather than blocking the whole release on VirusTotal's queue.
                for ($i = 0; $i -lt 40; $i++) {
                  Start-Sleep -Seconds 15
                  $analysis = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$analysisId" -Headers $headers -Method Get
                  if ($analysis.data.attributes.status -eq "completed") {
                    $stats = $analysis.data.attributes.stats
                    break
                  }
                }
              } catch {
                Write-Warning "VirusTotal submission failed for $Path : $_"
                $analysisId = $null
              }
            }

            if (-not $stats) {
              if ($analysisId) {
                # Submission succeeded, VirusTotal just hasn't finished analyzing yet -- the
                # analysis-status page is valid immediately (unlike the file-hash page above)
                # and shows live progress, so link there instead of a page that would 404.
                $analysisUrl = "https://www.virustotal.com/gui/file-analysis/$analysisId"
                Write-Warning "VirusTotal scan did not finish in time for $Path -- still processing: $analysisUrl"
                "${Prefix}_vt_url=$analysisUrl" >> $env:GITHUB_OUTPUT
                "${Prefix}_vt_summary=scan submitted, still processing -- check the report directly" >> $env:GITHUB_OUTPUT
                "${Prefix}_vt_clean=" >> $env:GITHUB_OUTPUT
              } else {
                # Never actually got a report or an analysis id -- no VirusTotal page exists for
                # this hash yet, so don't link to one. The scheduled recheck will keep polling by
                # hash and pick this up automatically if the file ever does get scanned.
                Write-Warning "VirusTotal submission failed for $Path -- no report available yet."
                "${Prefix}_vt_url=" >> $env:GITHUB_OUTPUT
                "${Prefix}_vt_summary=scan submission failed -- will retry automatically" >> $env:GITHUB_OUTPUT
                "${Prefix}_vt_clean=" >> $env:GITHUB_OUTPUT
              }
              return
            }

            $malicious = [int]$stats.malicious
            $suspicious = [int]$stats.suspicious
            $clean = [int]$stats.undetected + [int]$stats.harmless
            $flagged = ($malicious -gt 0) -or ($suspicious -gt 0)
            $summary = if ($flagged) {
              "$malicious malicious / $suspicious suspicious (of $($clean + $malicious + $suspicious) engines) -- review before trusting this build"
            } else {
              "0/$clean detections — clean"
            }

            $cleanStr = if ($flagged) { "false" } else { "true" }
            "${Prefix}_vt_url=$fileUrl" >> $env:GITHUB_OUTPUT
            "${Prefix}_vt_summary=$summary" >> $env:GITHUB_OUTPUT
            "${Prefix}_vt_clean=$cleanStr" >> $env:GITHUB_OUTPUT
            if ($flagged) {
              Write-Warning "VirusTotal flagged $Path : $summary -- $fileUrl"
            }
          }

          Invoke-VtScan -Path "dist\EveDeck-win-Portable.zip" -Prefix "portable"
          Invoke-VtScan -Path "app\installer\output\EveDeck-Setup-v${{ steps.ver.outputs.version }}.exe" -Prefix "installer"
          # EveDeck's own executable, scanned on its own rather than only inside a container.
          # Added after the 2026-09-15 investigation that retired Velopack: the portable zip used
          # to report 1 malicious while this binary measured 0/71, because the detection lived
          # entirely in Velopack's prebuilt stubs and never in EveDeck's code. Those stubs are
          # gone, but scanning the binary directly stays -- it is the only line that can prove the
          # app itself is clean independently of whatever container ships it. Costs no extra quota
          # once the hash is known: the function returns an existing report without re-uploading.
          Invoke-VtScan -Path "publish-ci\EveDeck.exe" -Prefix "app"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: EveDeck v${{ steps.ver.outputs.version }}
          body: |
            ${{ steps.notes.outputs.notes }}

            **Two ways to install:**
            - **EveDeck-Setup-v${{ steps.ver.outputs.version }}.exe** — normal Windows installer (Start Menu
              shortcut, proper uninstaller, no admin rights needed).
            - **EveDeck-win-Portable.zip** — portable, just extract and run **EveDeck.exe**.

            No .NET runtime required either way — everything is bundled.

            **Updating:** neither download updates itself. EveDeck still tells you when a new version
            is out (Options → About → Check for Updates, or the update banner) and sends you here to
            get it. For the portable build, extract the new zip over your existing folder, replacing
            the files — your settings and logs live in `%LOCALAPPDATA%\EveDeck` and are untouched.
            For the installer, just run the newer installer. Only the Microsoft Store build updates
            itself, through the Store.

            > **Upgrading a portable install from v1.54.4 or earlier?** Those builds were packaged
            > with Velopack, so your folder has `Update.exe` and a `current\` subfolder. This one is
            > a plain zip. Extract it to a fresh folder and delete the old one (or at least delete
            > `Update.exe` and `current\`) rather than unpacking on top — and note the in-app
            > **Update** button in those older builds can no longer apply anything, so come here
            > instead. Settings carry over regardless; they are not stored in the app folder.

            > **Windows SmartScreen:** click **More info → Run anyway** on first launch.
            > Right-click → Properties → Unblock also removes the prompt permanently.

            ---

            🛡️ **VirusTotal**
            - **EveDeck.exe** (the app itself): [${{ steps.vt.outputs.app_vt_summary }}](${{ steps.vt.outputs.app_vt_url }}) (SHA-256 `${{ steps.vt.outputs.app_sha256 }}`)
            - installer download: [${{ steps.vt.outputs.installer_vt_summary }}](${{ steps.vt.outputs.installer_vt_url }}) (SHA-256 `${{ steps.vt.outputs.installer_sha256 }}`)
            - portable download: [${{ steps.vt.outputs.portable_vt_summary }}](${{ steps.vt.outputs.portable_vt_url }}) (SHA-256 `${{ steps.vt.outputs.portable_sha256 }}`)

            EveDeck's own executable is scanned on its own, not just inside the two download
            containers, so you can verify the binary you actually run.
          files: |
            dist/EveDeck-win-Portable.zip
            app/installer/output/EveDeck-Setup-v${{ steps.ver.outputs.version }}.exe

  update-site:
    needs: build-and-release
    runs-on: ubuntu-latest

    steps:
      # The website lives in its own repo (EveDeck-site); check it out to record the
      # release and deploy. RELEASES_REPO_TOKEN must have write access to EveDeck-site.
      - uses: actions/checkout@v7
        with:
          repository: EveDeck/EveDeck-site
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          ref: main

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Prepend release to content.ts
        shell: bash
        env:
          VERSION: ${{ needs.build-and-release.outputs.version }}
          NOTES: ${{ needs.build-and-release.outputs.notes }}
          PORTABLE_SHA256: ${{ needs.build-and-release.outputs.portable_sha256 }}
          PORTABLE_VT_URL: ${{ needs.build-and-release.outputs.portable_vt_url }}
          PORTABLE_VT_SUMMARY: ${{ needs.build-and-release.outputs.portable_vt_summary }}
          PORTABLE_VT_CLEAN: ${{ needs.build-and-release.outputs.portable_vt_clean }}
          INSTALLER_SHA256: ${{ needs.build-and-release.outputs.installer_sha256 }}
          INSTALLER_VT_URL: ${{ needs.build-and-release.outputs.installer_vt_url }}
          INSTALLER_VT_SUMMARY: ${{ needs.build-and-release.outputs.installer_vt_summary }}
          INSTALLER_VT_CLEAN: ${{ needs.build-and-release.outputs.installer_vt_clean }}
        run: |
          # Same changelog text as the GitHub release body (both come from the annotated tag
          # message) — turn each "- bullet" into its own whatsNew array entry instead of falling
          # back to the script's generic placeholder. GitHub's release-body Markdown renderer joins
          # a soft-wrapped continuation line back into the bullet above it, but a plain sed extract
          # of "- " lines does not -- it silently drops continuation lines, truncating any bullet
          # that was wrapped across multiple lines in the tag message (see v1.15.0, the first
          # release with multi-line bullets: the site's whatsNew ended up with six truncated
          # half-sentences instead of six complete ones, while the GitHub release itself looked
          # fine). This joins continuation lines (anything not starting with -/*) back onto the
          # current bullet before extracting, so wrapping a long bullet in the tag message is safe.
          mapfile -t BULLETS < <(echo "$NOTES" | awk '
            /^[[:space:]]*[-*][[:space:]]/ {
              if (buf != "") print buf
              sub(/^[[:space:]]*[-*][[:space:]]*/, "")
              buf = $0
              next
            }
            /^[[:space:]]*$/ { next }
            {
              sub(/^[[:space:]]+/, "")
              buf = buf " " $0
            }
            END { if (buf != "") print buf }
          ')
          FLAGS=("--installer-url=https://github.com/EveDeck/EveDeck/releases/download/v$VERSION/EveDeck-Setup-v$VERSION.exe")
          [ -n "$PORTABLE_SHA256" ] && FLAGS+=("--sha256=$PORTABLE_SHA256")
          [ -n "$PORTABLE_VT_URL" ] && FLAGS+=("--virustotal-url=$PORTABLE_VT_URL")
          [ -n "$PORTABLE_VT_SUMMARY" ] && FLAGS+=("--virustotal-summary=$PORTABLE_VT_SUMMARY")
          [ -n "$PORTABLE_VT_CLEAN" ] && FLAGS+=("--virustotal-clean=$PORTABLE_VT_CLEAN")
          [ -n "$INSTALLER_SHA256" ] && FLAGS+=("--installer-sha256=$INSTALLER_SHA256")
          [ -n "$INSTALLER_VT_URL" ] && FLAGS+=("--installer-virustotal-url=$INSTALLER_VT_URL")
          [ -n "$INSTALLER_VT_SUMMARY" ] && FLAGS+=("--installer-virustotal-summary=$INSTALLER_VT_SUMMARY")
          [ -n "$INSTALLER_VT_CLEAN" ] && FLAGS+=("--installer-virustotal-clean=$INSTALLER_VT_CLEAN")
          # downloadUrl / sha256 / virustotal-* describe the portable zip, whatever it is packaged
          # as at the time: a plain zip again since 2026-09-15, a Velopack package before that.
          # The content.ts field names have outlived both and are deliberately not renamed.
          node scripts/add-release.mjs "$VERSION" \
            "https://github.com/EveDeck/EveDeck/releases/download/v$VERSION/EveDeck-win-Portable.zip" \
            "${FLAGS[@]}" "${BULLETS[@]}"

      - name: Commit content.ts update
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/content.ts
          if git diff --cached --quiet; then
            echo "content.ts unchanged — nothing to commit"
          else
            git commit -m "chore: add release v${{ needs.build-and-release.outputs.version }} to content.ts

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            git push origin HEAD:main
          fi

      - name: Setup SSH and deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_REMOTE_HOST: ${{ secrets.DEPLOY_REMOTE_HOST }}
          DEPLOY_REMOTE_USER: ${{ secrets.DEPLOY_REMOTE_USER }}
          DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$DEPLOY_REMOTE_HOST" >> "$HOME/.ssh/known_hosts"
          chmod +x deploy/deploy.sh deploy/deploy-rsync.sh
          export EVEDECK_LOCAL_PATH="${{ github.workspace }}/"
          export EVEDECK_KEY_SSH="$HOME/.ssh/deploy_key"
          export EVEDECK_REMOTE_HOST="$DEPLOY_REMOTE_HOST"
          export EVEDECK_REMOTE_USER="$DEPLOY_REMOTE_USER"
          export EVEDECK_REMOTE_PATH="$DEPLOY_REMOTE_PATH"
          export EVEDECK_APP_NAME="evedeck"
          export EVEDECK_HEALTHCHECK_URL="https://evedeck.space/health"
          bash deploy/deploy.sh
