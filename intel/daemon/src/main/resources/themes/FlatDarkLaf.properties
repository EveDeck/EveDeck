# EveDeck palette for the parts of FlatLaf that cannot be set from code.
#
# Most of the theme lives in Theme.kt, where the colours sit next to the components they belong to.
# These cannot: FlatLaf builds its icons while installing the look and feel and each icon reads its
# colours once, in its constructor, so a UIManager.put afterwards paints nothing. A custom defaults
# file is applied during that install, which is early enough.
#
# Loaded by FlatLaf.registerCustomDefaultsSource("themes") in Theme.install().

# --- checkbox -----------------------------------------------------------------------------------
# The default dark checkbox is a light grey square, which against this background reads as a row of
# disabled controls rather than empty ones.
CheckBox.icon.background = #121b2a
CheckBox.icon.borderColor = #1c2a3d
CheckBox.icon.selectedBackground = #121b2a
CheckBox.icon.selectedBorderColor = #22c3ff
CheckBox.icon.checkmarkColor = #22c3ff
CheckBox.icon.focusedBackground = #121b2a
CheckBox.icon.focusedBorderColor = #22c3ff
CheckBox.icon.hoverBackground = #1c2a3d
CheckBox.icon.hoverBorderColor = #22c3ff
CheckBox.icon.disabledBackground = #0d1420
CheckBox.icon.disabledBorderColor = #1c2a3d
